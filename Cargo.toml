[workspace]
members = ["crates/avian-tdp", "crates/avian-sv2-pool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
# Framing, Noise and message codecs, all from the Stratum v2 Reference
# Implementation. codec_sv2 needs its noise_sv2 feature turned on explicitly;
# without it only the plaintext encoder and decoder are compiled.
codec_sv2 = { version = "7.0.0", features = ["noise_sv2"] }
noise_sv2 = "2.0.0"
framing_sv2 = "8.0.0"
binary_sv2 = "7.0.0"
common_messages_sv2 = "9.0.0"
template_distribution_sv2 = "7.0.0"

# Not an SRI crate, but the version noise_sv2 itself depends on, so it adds
# nothing to the tree. Needed to turn the node's 32-byte authority private key
# file into the x-only public key noise_sv2 checks the certificate against.
secp256k1 = { version = "0.28.2", features = ["std"] }
